<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 坦克大战 - Tank Battle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', 'Microsoft YaHei', monospace;
            overflow: hidden;
            user-select: none;
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .game-container {
            position: relative;
            border: 3px solid #555;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 150, 0, 0.3), inset 0 0 30px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            background: #1a1a1a;
        }

        .side-panel {
            background: #111;
            border: 3px solid #555;
            border-radius: 4px;
            padding: 20px;
            color: #0f0;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 20px rgba(0, 150, 0, 0.2);
        }

        .side-panel h2 {
            text-align: center;
            font-size: 22px;
            color: #ff0;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
            letter-spacing: 3px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
        }

        .stat-label {
            color: #aaa;
        }

        .stat-value {
            color: #fff;
            font-weight: bold;
            font-size: 20px;
        }

        .stat-value.lives {
            color: #f44;
        }

        .stat-value.score {
            color: #ff0;
        }

        .stat-value.level {
            color: #4af;
        }

        .controls-info {
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .controls-info h3 {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .controls-info p {
            font-size: 12px;
            color: #888;
            margin: 5px 0;
            line-height: 1.6;
        }

        .controls-info .key {
            display: inline-block;
            background: #333;
            color: #0f0;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            min-width: 20px;
            text-align: center;
        }

        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        .game-over-overlay.active {
            display: flex;
        }

        .game-over-overlay .title {
            font-size: 48px;
            color: #f00;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .game-over-overlay .final-score {
            font-size: 24px;
            color: #ff0;
            margin-bottom: 10px;
        }

        .game-over-overlay .restart-hint {
            font-size: 16px;
            color: #aaa;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .pause-overlay.active {
            display: flex;
        }

        .pause-overlay span {
            font-size: 36px;
            color: #fff;
            letter-spacing: 5px;
        }

        @media (max-width: 900px) {
            .game-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .side-panel {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-around;
                padding: 10px;
            }
            .side-panel h2 {
                width: 100%;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-container" id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="title">GAME OVER</div>
                <div class="final-score" id="finalScore">得分: 0</div>
                <div class="restart-hint">按 Enter 重新开始</div>
            </div>
            <div class="pause-overlay" id="pauseOverlay">
                <span>⏸ 已暂停</span>
            </div>
        </div>
        <div class="side-panel">
            <h2>🎮 坦克大战</h2>
            <div class="stat-item">
                <span class="stat-label">❤️ 生命</span>
                <span class="stat-value lives" id="livesDisplay">3</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">⭐ 得分</span>
                <span class="stat-value score" id="scoreDisplay">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">🏆 关卡</span>
                <span class="stat-value level" id="levelDisplay">1</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">💀 击杀</span>
                <span class="stat-value" id="killsDisplay">0</span>
            </div>
            <div class="controls-info">
                <h3>🎯 操作说明</h3>
                <p><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 或 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 移动</p>
                <p><span class="key">空格</span> 或 <span class="key">J</span> 发射子弹</p>
                <p><span class="key">P</span> 暂停游戏</p>
                <p><span class="key">R</span> 重新开始</p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 游戏常量 ====================
            const TILE_SIZE = 40;
            const COLS = 19;
            const ROWS = 15;
            const CANVAS_WIDTH = COLS * TILE_SIZE;
            const CANVAS_HEIGHT = ROWS * TILE_SIZE;
            const PLAYER_SPEED = 3;
            const ENEMY_SPEED = 1.5;
            const BULLET_SPEED = 5;
            const ENEMY_BULLET_SPEED = 3;
            const MAX_ENEMIES = 4;
            const PLAYER_FIRE_DELAY = 400; // ms
            const ENEMY_FIRE_DELAY = 1500;
            const SPAWN_DELAY = 3000;
            const INVINCIBLE_DURATION = 2000;
            const TANK_SIZE = TILE_SIZE - 4;

            // 方向
            const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };

            // 地图元素
            const TILE = { EMPTY: 0, BRICK: 1, STEEL: 2, WATER: 3, BASE: 4 };

            // ==================== 获取元素 ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const gameContainer = document.getElementById('gameContainer');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const pauseOverlay = document.getElementById('pauseOverlay');
            const finalScoreEl = document.getElementById('finalScore');
            const livesDisplay = document.getElementById('livesDisplay');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const levelDisplay = document.getElementById('levelDisplay');
            const killsDisplay = document.getElementById('killsDisplay');

            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;

            // ==================== 音效系统（简易） ====================
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            let audioCtx;

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new AudioCtx();
                }
            }

            function playBeep(freq, duration, type = 'square', vol = 0.05) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + duration);
                } catch (e) {
                    // 忽略音频错误
                }
            }

            function sfxShoot() { playBeep(800, 0.08, 'square', 0.04); }
            function sfxHit() { playBeep(150, 0.15, 'sawtooth', 0.06); }
            function sfxExplosion() { playBeep(60, 0.3, 'sawtooth', 0.08); }
            function sfxPowerUp() { playBeep(1200, 0.1, 'square', 0.05); playBeep(1600, 0.15, 'square', 0.05); }

            // ==================== 游戏状态 ====================
            let gameState = 'waiting'; // waiting, playing, paused, over
            let score = 0;
            let lives = 3;
            let level = 1;
            let kills = 0;
            let player = null;
            let enemies = [];
            let bullets = [];
            let particles = [];
            let map = [];
            let spawnTimer = 0;
            let lastSpawnTime = 0;
            let animationId = null;
            let keys = {};
            let basePosition = { col: 9, row: 14 }; // 基地位置（底部中央）

            // ==================== 地图 ====================
            function generateMap(lvl) {
                const m = Array.from({ length: ROWS }, () => Array(COLS).fill(TILE.EMPTY));

                // 边界（不可破坏的钢墙）
                // 内部不设边界墙，让游戏更开放

                // 砖块布局
                const brickPatterns = [
                    // 第1关
                    () => {
                        // 对称的砖块群
                        for (let r = 1; r < ROWS - 1; r++) {
                            for (let c = 1; c < COLS - 1; c++) {
                                // 跳过基地周围
                                if (c >= 8 && c <= 10 && r >= 13) continue;
                                // 棋盘格布局，但中间留通道
                                if ((r + c) % 3 === 0 && !(c === 9 && r % 2 === 0)) {
                                    m[r][c] = TILE.BRICK;
                                }
                            }
                        }
                        // 添加一些钢墙
                        m[3][3] = TILE.STEEL;
                        m[3][15] = TILE.STEEL;
                        m[11][3] = TILE.STEEL;
                        m[11][15] = TILE.STEEL;
                        m[7][9] = TILE.STEEL;
                    },
                    // 第2关
                    () => {
                        // 横条布局
                        for (let r = 2; r < ROWS - 2; r += 3) {
                            for (let c = 1; c < COLS - 1; c++) {
                                if (!(c >= 8 && c <= 10 && r >= 12)) {
                                    m[r][c] = TILE.BRICK;
                                    if (c % 4 === 0) m[r][c] = TILE.STEEL;
                                }
                            }
                        }
                        // 竖条打通
                        for (let r = 1; r < ROWS - 1; r++) {
                            m[r][3] = TILE.EMPTY;
                            m[r][9] = TILE.EMPTY;
                            m[r][15] = TILE.EMPTY;
                        }
                    },
                    // 第3关
                    () => {
                        // 迷宫式
                        for (let r = 1; r < ROWS - 1; r++) {
                            for (let c = 1; c < COLS - 1; c++) {
                                if (c >= 8 && c <= 10 && r >= 13) continue;
                                if (r % 2 === 0 && c % 2 === 0) {
                                    m[r][c] = TILE.STEEL;
                                } else if ((r % 2 === 1 && c % 4 === 0) || (c % 2 === 1 && r % 4 === 0)) {
                                    m[r][c] = TILE.BRICK;
                                }
                            }
                        }
                    }
                ];

                const patternIndex = (lvl - 1) % brickPatterns.length;
                brickPatterns[patternIndex]();

                // 基地保护墙
                const bx = basePosition.col;
                const by = basePosition.row;
                m[by - 1][bx - 1] = TILE.BRICK;
                m[by - 1][bx] = TILE.BRICK;
                m[by - 1][bx + 1] = TILE.BRICK;
                m[by][bx - 1] = TILE.BRICK;
                m[by][bx + 1] = TILE.BRICK;

                // 基地本身
                m[by][bx] = TILE.BASE;

                // 确保玩家出生点为空（左上角附近）
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        m[r][c] = TILE.EMPTY;
                    }
                }
                // 右上角出生点
                for (let r = 0; r < 3; r++) {
                    for (let c = COLS - 3; c < COLS; c++) {
                        m[r][c] = TILE.EMPTY;
                    }
                }
                // 左下角出生点
                for (let r = ROWS - 3; r < ROWS; r++) {
                    for (let c = 0; c < 3; c++) {
                        m[r][c] = TILE.EMPTY;
                    }
                }

                return m;
            }

            // ==================== 坦克类 ====================
            class Tank {
                constructor(x, y, dir, color, speed, isPlayer = false) {
                    this.x = x;
                    this.y = y;
                    this.dir = dir;
                    this.color = color;
                    this.speed = speed;
                    this.isPlayer = isPlayer;
                    this.width = TANK_SIZE;
                    this.height = TANK_SIZE;
                    this.fireDelay = isPlayer ? PLAYER_FIRE_DELAY : ENEMY_FIRE_DELAY;
                    this.lastFireTime = 0;
                    this.alive = true;
                    this.invincible = false;
                    this.invincibleTimer = 0;
                    this.moveTimer = 0;
                    this.moveDirection = dir;
                    this.aiChangeInterval = 1000 + Math.random() * 2000;
                }

                getCenterX() {
                    return this.x + this.width / 2;
                }

                getCenterY() {
                    return this.y + this.height / 2;
                }

                getBounds() {
                    return {
                        left: this.x,
                        top: this.y,
                        right: this.x + this.width,
                        bottom: this.y + this.height
                    };
                }

                collidesWith(otherBounds) {
                    const a = this.getBounds();
                    return !(a.right <= otherBounds.left ||
                             a.left >= otherBounds.right ||
                             a.bottom <= otherBounds.top ||
                             a.top >= otherBounds.bottom);
                }

                collidesWithTile(tileCol, tileRow) {
                    const tileBounds = {
                        left: tileCol * TILE_SIZE,
                        top: tileRow * TILE_SIZE,
                        right: (tileCol + 1) * TILE_SIZE,
                        bottom: (tileRow + 1) * TILE_SIZE
                    };
                    return this.collidesWith(tileBounds);
                }

                collidesWithMap() {
                    const bounds = this.getBounds();
                    const leftCol = Math.floor(bounds.left / TILE_SIZE);
                    const rightCol = Math.floor((bounds.right - 1) / TILE_SIZE);
                    const topRow = Math.floor(bounds.top / TILE_SIZE);
                    const bottomRow = Math.floor((bounds.bottom - 1) / TILE_SIZE);

                    for (let r = topRow; r <= bottomRow; r++) {
                        for (let c = leftCol; c <= rightCol; c++) {
                            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) continue;
                            const tile = map[r][c];
                            if (tile === TILE.BRICK || tile === TILE.STEEL || tile === TILE.BASE) {
                                if (this.collidesWithTile(c, r)) {
                                    return true;
                                }
                            }
                        }
                    }
                    return false;
                }

                collidesWithTank(other) {
                    if (!other || !other.alive || other === this) return false;
                    const a = this.getBounds();
                    const b = other.getBounds();
                    // 稍微缩小碰撞体积让移动更流畅
                    const margin = 2;
                    return !(a.right - margin <= b.left + margin ||
                             a.left + margin >= b.right - margin ||
                             a.bottom - margin <= b.top + margin ||
                             a.top + margin >= b.bottom - margin);
                }

                collidesWithAnyTank(tanks) {
                    for (const t of tanks) {
                        if (t !== this && t.alive && this.collidesWithTank(t)) {
                            return true;
                        }
                    }
                    return false;
                }

                move(dir, allTanks) {
                    const oldX = this.x;
                    const oldY = this.y;
                    const step = this.speed;

                    switch (dir) {
                        case DIR.UP: this.y -= step; break;
                        case DIR.DOWN: this.y += step; break;
                        case DIR.LEFT: this.x -= step; break;
                        case DIR.RIGHT: this.x += step; break;
                    }

                    this.dir = dir;

                    // 边界检查
                    if (this.x < 0) this.x = 0;
                    if (this.y < 0) this.y = 0;
                    if (this.x + this.width > CANVAS_WIDTH) this.x = CANVAS_WIDTH - this.width;
                    if (this.y + this.height > CANVAS_HEIGHT) this.y = CANVAS_HEIGHT - this.height;

                    // 碰撞检测
                    if (this.collidesWithMap() || this.collidesWithAnyTank(allTanks)) {
                        this.x = oldX;
                        this.y = oldY;
                        return false;
                    }
                    return true;
                }

                fire(currentTime) {
                    if (currentTime - this.lastFireTime < this.fireDelay) return null;
                    this.lastFireTime = currentTime;

                    const cx = this.getCenterX();
                    const cy = this.getCenterY();
                    const bulletSpeed = this.isPlayer ? BULLET_SPEED : ENEMY_BULLET_SPEED;

                    let bx = cx - 3;
                    let by = cy - 3;

                    if (this.isPlayer) {
                        switch (this.dir) {
                            case DIR.UP: bx = cx - 3; by = this.y - 6; break;
                            case DIR.DOWN: bx = cx - 3; by = this.y + this.height; break;
                            case DIR.LEFT: bx = this.x - 6; by = cy - 3; break;
                            case DIR.RIGHT: bx = this.x + this.width; by = cy - 3; break;
                        }
                    } else {
                        switch (this.dir) {
                            case DIR.UP: bx = cx - 3; by = this.y - 6; break;
                            case DIR.DOWN: bx = cx - 3; by = this.y + this.height; break;
                            case DIR.LEFT: bx = this.x - 6; by = cy - 3; break;
                            case DIR.RIGHT: bx = this.x + this.width; by = cy - 3; break;
                        }
                    }

                    return new Bullet(bx, by, this.dir, bulletSpeed, this.isPlayer);
                }

                update(currentTime, allTanks) {
                    if (!this.alive) return;

                    if (this.invincible) {
                        this.invincibleTimer -= 16; // ~60fps
                        if (this.invincibleTimer <= 0) {
                            this.invincible = false;
                        }
                    }
                }

                draw(ctx) {
                    if (!this.alive) return;

                    ctx.save();
                    const cx = this.x + this.width / 2;
                    const cy = this.y + this.height / 2;

                    ctx.translate(cx, cy);
                    const angle = this.dir * Math.PI / 2;
                    ctx.rotate(angle);

                    // 闪烁效果（无敌状态）
                    if (this.invincible && Math.floor(Date.now() / 80) % 2 === 0) {
                        ctx.globalAlpha = 0.5;
                    }

                    const hw = this.width / 2;
                    const hh = this.height / 2;

                    // 坦克履带
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-hw + 2, -hh, hw - 4, this.height);
                    ctx.fillRect(hw - hw + 2, -hh, hw - 4, this.height);

                    // 履带纹理
                    ctx.fillStyle = '#444';
                    for (let i = -hh + 4; i < hh; i += 8) {
                        ctx.fillRect(-hw + 2, i, hw - 4, 3);
                    }

                    // 坦克身体
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-hw + 6, -hh + 2, this.width - 12, this.height - 4);

                    // 坦克炮塔
                    ctx.fillStyle = this.isPlayer ? '#ff0' : '#faa';
                    ctx.fillRect(-5, -hh + 2, 10, this.height - 4);

                    // 炮管
                    ctx.fillStyle = '#ddd';
                    ctx.fillRect(-3, -hh - 10, 6, 16);

                    // 高光
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(-hw + 8, -hh + 4, this.width - 16, 5);

                    ctx.restore();
                }
            }

            // ==================== 子弹类 ====================
            class Bullet {
                constructor(x, y, dir, speed, isPlayerBullet) {
                    this.x = x;
                    this.y = y;
                    this.dir = dir;
                    this.speed = speed;
                    this.isPlayerBullet = isPlayerBullet;
                    this.width = 6;
                    this.height = 6;
                    this.alive = true;
                }

                getBounds() {
                    return {
                        left: this.x,
                        top: this.y,
                        right: this.x + this.width,
                        bottom: this.y + this.height
                    };
                }

                update() {
                    switch (this.dir) {
                        case DIR.UP: this.y -= this.speed; break;
                        case DIR.DOWN: this.y += this.speed; break;
                        case DIR.LEFT: this.x -= this.speed; break;
                        case DIR.RIGHT: this.x += this.speed; break;
                    }

                    // 出界
                    if (this.x < -10 || this.x > CANVAS_WIDTH + 10 ||
                        this.y < -10 || this.y > CANVAS_HEIGHT + 10) {
                        this.alive = false;
                    }

                    // 碰撞地图
                    const col = Math.floor((this.x + this.width / 2) / TILE_SIZE);
                    const row = Math.floor((this.y + this.height / 2) / TILE_SIZE);
                    if (row >= 0 && row < ROWS && col >= 0 && col < COLS) {
                        const tile = map[row][col];
                        if (tile === TILE.BRICK) {
                            map[row][col] = TILE.EMPTY;
                            this.alive = false;
                            spawnParticles(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE + TILE_SIZE / 2, '#c84');
                        } else if (tile === TILE.STEEL) {
                            this.alive = false;
                            spawnParticles(this.x + 3, this.y + 3, '#fff', 3);
                        } else if (tile === TILE.BASE) {
                            map[row][col] = TILE.EMPTY;
                            this.alive = false;
                            spawnParticles(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE + TILE_SIZE / 2, '#f00', 20);
                            onBaseDestroyed();
                        }
                    }
                }

                draw(ctx) {
                    if (!this.alive) return;
                    ctx.fillStyle = this.isPlayerBullet ? '#ff0' : '#f44';
                    ctx.shadowColor = this.isPlayerBullet ? '#ff0' : '#f44';
                    ctx.shadowBlur = 6;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.shadowBlur = 0;
                }
            }

            // ==================== 粒子系统 ====================
            class Particle {
                constructor(x, y, color, speed, life) {
                    this.x = x;
                    this.y = y;
                    this.color = color;
                    const angle = Math.random() * Math.PI * 2;
                    const spd = speed * (0.5 + Math.random());
                    this.vx = Math.cos(angle) * spd;
                    this.vy = Math.sin(angle) * spd;
                    this.life = life;
                    this.maxLife = life;
                    this.size = 1 + Math.random() * 3;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.96;
                    this.vy *= 0.96;
                    this.life--;
                    return this.life > 0;
                }

                draw(ctx) {
                    const alpha = this.life / this.maxLife;
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = alpha;
                    ctx.fillRect(this.x, this.y, this.size, this.size);
                    ctx.globalAlpha = 1;
                }
            }

            function spawnParticles(x, y, color, count = 8) {
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle(x, y, color, 2 + Math.random() * 4, 15 + Math.random() * 15));
                }
            }

            // ==================== 敌人AI ====================
            function updateEnemyAI(enemy, currentTime) {
                if (!enemy.alive) return;

                // 随机改变方向
                if (currentTime - enemy.moveTimer > enemy.aiChangeInterval) {
                    const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
                    enemy.moveDirection = dirs[Math.floor(Math.random() * 4)];
                    enemy.moveTimer = currentTime;
                    enemy.aiChangeInterval = 800 + Math.random() * 2000;
                }

                // 有时朝向玩家
                if (player && player.alive && Math.random() < 0.02) {
                    const dx = player.getCenterX() - enemy.getCenterX();
                    const dy = player.getCenterY() - enemy.getCenterY();
                    if (Math.abs(dx) > Math.abs(dy)) {
                        enemy.moveDirection = dx > 0 ? DIR.RIGHT : DIR.LEFT;
                    } else {
                        enemy.moveDirection = dy > 0 ? DIR.DOWN : DIR.UP;
                    }
                }

                // 移动
                const allTanks = [player, ...enemies].filter(t => t && t.alive);
                const moved = enemy.move(enemy.moveDirection, allTanks);
                if (!moved) {
                    // 撞墙时改变方向
                    const dirs = [DIR.UP, DIR.DOWN, DIR.LEFT, DIR.RIGHT];
                    enemy.moveDirection = dirs[Math.floor(Math.random() * 4)];
                    enemy.moveTimer = currentTime;
                }

                // 随机开火
                if (Math.random() < 0.015) {
                    const bullet = enemy.fire(currentTime);
                    if (bullet) bullets.push(bullet);
                }
            }

            // ==================== 基地被摧毁 ====================
            function onBaseDestroyed() {
                sfxExplosion();
                gameState = 'over';
                gameOverOverlay.classList.add('active');
                finalScoreEl.textContent = '得分: ' + score;
                player.alive = false;
            }

            // ==================== 关卡管理 ====================
            function nextLevel() {
                level++;
                levelDisplay.textContent = level;
                sfxPowerUp();
                initLevel();
            }

            function initLevel() {
                map = generateMap(level);
                player = new Tank(
                    CANVAS_WIDTH / 2 - TANK_SIZE / 2,
                    CANVAS_HEIGHT - TANK_SIZE - 10,
                    DIR.UP,
                    '#4a4',
                    PLAYER_SPEED,
                    true
                );
                player.invincible = true;
                player.invincibleTimer = INVINCIBLE_DURATION;

                enemies = [];
                bullets = [];
                particles = [];
                spawnTimer = 0;
                lastSpawnTime = performance.now();

                // 初始生成敌人
                spawnEnemy();
                if (level >= 2) spawnEnemy();
            }

            function spawnEnemy() {
                if (enemies.length >= MAX_ENEMIES) return;

                const spawnPoints = [
                    { x: 10, y: 10 },
                    { x: CANVAS_WIDTH - TANK_SIZE - 10, y: 10 },
                    { x: 10, y: CANVAS_HEIGHT / 2 },
                    { x: CANVAS_WIDTH - TANK_SIZE - 10, y: CANVAS_HEIGHT / 2 },
                ];

                // 找一个不与其他坦克重叠的出生点
                const allTanks = [player, ...enemies].filter(t => t && t.alive);
                const availablePoints = spawnPoints.filter(sp => {
                    const testTank = new Tank(sp.x, sp.y, DIR.DOWN, '#f44', ENEMY_SPEED);
                    return !testTank.collidesWithAnyTank(allTanks) && !testTank.collidesWithMap();
                });

                if (availablePoints.length === 0) return;

                const sp = availablePoints[Math.floor(Math.random() * availablePoints.length)];
                const enemyColors = ['#e44', '#e84', '#e48', '#c4e'];
                const color = enemyColors[Math.floor(Math.random() * enemyColors.length)];

                // 随等级提高速度
                const speed = ENEMY_SPEED + (level - 1) * 0.3;

                const enemy = new Tank(sp.x, sp.y, DIR.DOWN, color, speed, false);
                enemy.moveTimer = performance.now();
                enemy.invincible = true;
                enemy.invincibleTimer = 500;
                enemies.push(enemy);
            }

            // ==================== 碰撞检测：子弹 vs 坦克 ====================
            function checkBulletTankCollisions() {
                for (const bullet of bullets) {
                    if (!bullet.alive) continue;

                    if (bullet.isPlayerBullet) {
                        // 玩家子弹打敌人
                        for (const enemy of enemies) {
                            if (!enemy.alive || enemy.invincible) continue;
                            if (isColliding(bullet.getBounds(), enemy.getBounds())) {
                                bullet.alive = false;
                                enemy.alive = false;
                                kills++;
                                score += 100;
                                sfxHit();
                                spawnParticles(enemy.getCenterX(), enemy.getCenterY(), enemy.color, 12);
                                updateUI();
                            }
                        }
                    } else {
                        // 敌人子弹打玩家
                        if (!player || !player.alive || player.invincible) continue;
                        if (isColliding(bullet.getBounds(), player.getBounds())) {
                            bullet.alive = false;
                            playerHit();
                        }
                    }
                }
            }

            function isColliding(a, b) {
                return !(a.right <= b.left ||
                         a.left >= b.right ||
                         a.bottom <= b.top ||
                         a.top >= b.bottom);
            }

            function playerHit() {
                if (!player || !player.alive) return;
                lives--;
                sfxExplosion();
                spawnParticles(player.getCenterX(), player.getCenterY(), '#4f4', 15);
                updateUI();

                if (lives <= 0) {
                    player.alive = false;
                    gameState = 'over';
                    gameOverOverlay.classList.add('active');
                    finalScoreEl.textContent = '得分: ' + score;
                } else {
                    // 重生
                    player.x = CANVAS_WIDTH / 2 - TANK_SIZE / 2;
                    player.y = CANVAS_HEIGHT - TANK_SIZE - 10;
                    player.dir = DIR.UP;
                    player.invincible = true;
                    player.invincibleTimer = INVINCIBLE_DURATION;
                }
            }

            function updateUI() {
                livesDisplay.textContent = lives;
                scoreDisplay.textContent = score;
                levelDisplay.textContent = level;
                killsDisplay.textContent = kills;
            }

            // ==================== 主循环 ====================
            function gameLoop(timestamp) {
                if (gameState === 'over' || gameState === 'waiting') {
                    // 仍然渲染
                    draw();
                    animationId = requestAnimationFrame(gameLoop);
                    return;
                }

                if (gameState === 'paused') {
                    animationId = requestAnimationFrame(gameLoop);
                    return;
                }

                // 更新玩家
                if (player && player.alive) {
                    player.update(timestamp, [player, ...enemies]);

                    const allTanks = [player, ...enemies].filter(t => t && t.alive);

                    if (keys['ArrowUp'] || keys['KeyW']) player.move(DIR.UP, allTanks);
                    if (keys['ArrowDown'] || keys['KeyS']) player.move(DIR.DOWN, allTanks);
                    if (keys['ArrowLeft'] || keys['KeyA']) player.move(DIR.LEFT, allTanks);
                    if (keys['ArrowRight'] || keys['KeyD']) player.move(DIR.RIGHT, allTanks);
                    if (keys['Space'] || keys['KeyJ']) {
                        const bullet = player.fire(timestamp);
                        if (bullet) {
                            bullets.push(bullet);
                            sfxShoot();
                        }
                    }
                }

                // 更新敌人
                for (const enemy of enemies) {
                    if (enemy.alive) {
                        enemy.update(timestamp, [player, ...enemies]);
                        updateEnemyAI(enemy, timestamp);
                    }
                }

                // 更新子弹
                for (const bullet of bullets) {
                    if (bullet.alive) bullet.update();
                }

                // 清理
                bullets = bullets.filter(b => b.alive);
                enemies = enemies.filter(e => e.alive);

                // 检测碰撞
                checkBulletTankCollisions();

                // 敌人重生
                if (timestamp - lastSpawnTime > SPAWN_DELAY && enemies.length < MAX_ENEMIES) {
                    spawnEnemy();
                    lastSpawnTime = timestamp;
                }

                // 更新粒子
                particles = particles.filter(p => p.update());

                // 检查是否进入下一关
                if (enemies.length === 0 && kills >= level * 4) {
                    nextLevel();
                }

                // 检查基地是否完好
                let baseIntact = false;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (map[r][c] === TILE.BASE) {
                            baseIntact = true;
                            break;
                        }
                    }
                    if (baseIntact) break;
                }
                if (!baseIntact && gameState === 'playing') {
                    onBaseDestroyed();
                }

                // 渲染
                draw();

                animationId = requestAnimationFrame(gameLoop);
            }

            // ==================== 渲染 ====================
            function draw() {
                ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                // 背景网格
                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 1;
                for (let x = 0; x < CANVAS_WIDTH; x += TILE_SIZE) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, CANVAS_HEIGHT);
                    ctx.stroke();
                }
                for (let y = 0; y < CANVAS_HEIGHT; y += TILE_SIZE) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(CANVAS_WIDTH, y);
                    ctx.stroke();
                }

                // 绘制地图
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const tile = map[r][c];
                        if (tile === TILE.EMPTY) continue;

                        const x = c * TILE_SIZE;
                        const y = r * TILE_SIZE;

                        switch (tile) {
                            case TILE.BRICK:
                                // 砖块
                                ctx.fillStyle = '#b5651d';
                                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                                // 砖缝
                                ctx.strokeStyle = '#8b4513';
                                ctx.lineWidth = 1;
                                ctx.strokeRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                                ctx.beginPath();
                                ctx.moveTo(x, y + TILE_SIZE / 2);
                                ctx.lineTo(x + TILE_SIZE, y + TILE_SIZE / 2);
                                ctx.moveTo(x + TILE_SIZE / 2, y);
                                ctx.lineTo(x + TILE_SIZE / 2, y + TILE_SIZE / 2);
                                ctx.moveTo(x + TILE_SIZE / 4, y + TILE_SIZE / 2);
                                ctx.lineTo(x + TILE_SIZE / 4, y + TILE_SIZE);
                                ctx.moveTo(x + TILE_SIZE * 3 / 4, y + TILE_SIZE / 2);
                                ctx.lineTo(x + TILE_SIZE * 3 / 4, y + TILE_SIZE);
                                ctx.stroke();
                                // 纹理
                                ctx.fillStyle = '#d4842a';
                                ctx.fillRect(x + 3, y + 3, 6, 6);
                                ctx.fillRect(x + TILE_SIZE / 2 + 3, y + TILE_SIZE / 2 + 3, 6, 6);
                                break;

                            case TILE.STEEL:
                                // 钢墙
                                ctx.fillStyle = '#888';
                                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                                ctx.fillStyle = '#aaa';
                                ctx.fillRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                                ctx.fillStyle = '#999';
                                ctx.fillRect(x + 6, y + 6, TILE_SIZE - 12, TILE_SIZE - 12);
                                ctx.strokeStyle = '#666';
                                ctx.lineWidth = 1;
                                ctx.strokeRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                                // 铆钉
                                ctx.fillStyle = '#555';
                                ctx.beginPath();
                                ctx.arc(x + 8, y + 8, 2, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.beginPath();
                                ctx.arc(x + TILE_SIZE - 8, y + 8, 2, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.beginPath();
                                ctx.arc(x + 8, y + TILE_SIZE - 8, 2, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.beginPath();
                                ctx.arc(x + TILE_SIZE - 8, y + TILE_SIZE - 8, 2, 0, Math.PI * 2);
                                ctx.fill();
                                break;

                            case TILE.BASE:
                                // 基地
                                const gradient = ctx.createRadialGradient(
                                    x + TILE_SIZE / 2, y + TILE_SIZE / 2, 2,
                                    x + TILE_SIZE / 2, y + TILE_SIZE / 2, TILE_SIZE / 2
                                );
                                gradient.addColorStop(0, '#fff');
                                gradient.addColorStop(0.3, '#ff0');
                                gradient.addColorStop(0.7, '#f80');
                                gradient.addColorStop(1, '#400');
                                ctx.fillStyle = gradient;
                                ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                                // 鹰标志
                                ctx.fillStyle = '#fff';
                                ctx.font = '24px serif';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText('🦅', x + TILE_SIZE / 2, y + TILE_SIZE / 2);
                                break;
                        }
                    }
                }

                // 绘制敌人
                for (const enemy of enemies) {
                    enemy.draw(ctx);
                }

                // 绘制玩家
                if (player && player.alive) {
                    player.draw(ctx);
                }

                // 绘制子弹
                for (const bullet of bullets) {
                    bullet.draw(ctx);
                }

                // 绘制粒子
                for (const particle of particles) {
                    particle.draw(ctx);
                }

                // 进入下一关提示
                if (gameState === 'waiting') {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                    ctx.fillStyle = '#0f0';
                    ctx.font = 'bold 36px "Microsoft YaHei", "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🎮 坦克大战', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 - 30);
                    ctx.fillStyle = '#ff0';
                    ctx.font = '18px "Microsoft YaHei", "Courier New", monospace';
                    ctx.fillText('按 Enter 开始游戏', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 30);
                    ctx.fillText('使用方向键移动，空格射击', CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2 + 60);
                }
            }

            // ==================== 事件处理 ====================
            function handleKeyDown(e) {
                keys[e.code] = true;

                // 防止方向键滚动页面
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                    e.preventDefault();
                }

                // 音频初始化
                initAudio();

                // Enter 开始/重新开始
                if (e.code === 'Enter') {
                    if (gameState === 'waiting' || gameState === 'over') {
                        startGame();
                    }
                }

                // P 暂停
                if (e.code === 'KeyP' && gameState === 'playing') {
                    gameState = 'paused';
                    pauseOverlay.classList.add('active');
                } else if (e.code === 'KeyP' && gameState === 'paused') {
                    gameState = 'playing';
                    pauseOverlay.classList.remove('active');
                }

                // R 重新开始
                if (e.code === 'KeyR') {
                    startGame();
                }
            }

            function handleKeyUp(e) {
                keys[e.code] = false;
            }

            // ==================== 游戏启动 ====================
            function startGame() {
                score = 0;
                lives = 3;
                level = 1;
                kills = 0;
                updateUI();
                gameOverOverlay.classList.remove('active');
                pauseOverlay.classList.remove('active');
                gameState = 'playing';
                initLevel();
            }

            // ==================== 初始化 ====================
            function init() {
                map = generateMap(1);
                player = new Tank(
                    CANVAS_WIDTH / 2 - TANK_SIZE / 2,
                    CANVAS_HEIGHT - TANK_SIZE - 10,
                    DIR.UP,
                    '#4a4',
                    PLAYER_SPEED,
                    true
                );
                enemies = [];
                bullets = [];
                particles = [];
                updateUI();
                gameState = 'waiting';

                document.addEventListener('keydown', handleKeyDown);
                document.addEventListener('keyup', handleKeyUp);

                animationId = requestAnimationFrame(gameLoop);
            }

            init();

            console.log('🎮 坦克大战已就绪！');
            console.log('操作：方向键/WASD 移动，空格/J 射击，P 暂停，R 重新开始');
            console.log('保护你的基地🦅，消灭所有敌人！');
        })();
    </script>
</body>
